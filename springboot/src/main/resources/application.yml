server:
  port: 9090
  # 生产环境建议 SERVER_ADDRESS=127.0.0.1（由 Nginx 反向代理），本地开发保持默认
  address: ${SERVER_ADDRESS:0.0.0.0}

# 数据库配置：用户名/密码通过环境变量注入，避免硬编码入库
# 连接池大小可经 DB_POOL_SIZE 配置（HikariCP 默认 10，压测/生产按需调整）
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:library_room}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2b8&allowPublicKeyRetrieval=true
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 5
  main:
    allow-circular-references: true
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# 配置mybatis实体和xml映射
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.entity

# JWT 签名密钥：必须通过环境变量 JWT_SECRET 注入，留空则启动失败（fail-fast）
jwt:
  secret: ${JWT_SECRET:}
  expire-hours: 4

# 分页
pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql
